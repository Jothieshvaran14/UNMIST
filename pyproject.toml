[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unmist"
version = "0.1.0"
description = "Unmist - evidence-based knowledge intelligence platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Unmist Contributors" }]
dependencies = [
    "fastapi==0.144.0",
    "starlette==1.3.1",
    "uvicorn[standard]==0.51.0",
    "pydantic==2.12.3",
    "email-validator==2.3.0",
    "SQLAlchemy==2.0.20",
    "alembic==1.11.1",
    "psycopg2-binary==2.9.10",
    "python-dotenv==1.2.1",
    "python-jose[cryptography]==3.5.0",
    "argon2-cffi==25.1.0",
    "httpx==0.28.1",
    "beautifulsoup4==4.13.5",
    "lxml==6.0.2",
    "PyPDF2==3.0.1",
    "python-multipart==0.0.20",
    "tenacity==8.5.0",
    "python-dateutil==2.9.0",
    "pytz==2025.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-cov==6.2.1",
    "flake8==7.3.0",
    "isort==7.0.0",
    "mypy==1.18.2",
    "Faker==37.11.0",
]

[tool.setuptools]
package-dir = { "" = "backend" }
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers -W ignore::UserWarning -W ignore::DeprecationWarning"
markers = [
    "unit: fast, isolated tests",
    "integration: tests that use the database or filesystem",
    "security: authorization and tenant-isolation tests",
    "slow: expensive tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.isort]
profile = "black"
line_length = 100

[tool.coverage.run]
source = ["backend/app"]
omit = ["backend/app/*_pb2.py"]
