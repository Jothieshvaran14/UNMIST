[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unmist"
version = "0.1.0"
description = "Unmist - evidence-based knowledge intelligence platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Unmist Contributors" }]
dependencies = [
    "fastapi==0.144.0",
    "starlette==1.3.1",
    "uvicorn[standard]==0.51.0",
    "pydantic==2.12.3",
    "email-validator==2.3.0",
    "SQLAlchemy==2.0.20",
    "alembic==1.11.1",
    "psycopg2-binary==2.9.10",
    "python-dotenv==1.2.1",
    "python-jose[cryptography]==3.5.0",
    "argon2-cffi==25.1.0",
    "httpx==0.28.1",
    "beautifulsoup4==4.13.5",
    "lxml==6.0.2",
    "PyPDF2==3.0.1",
    "python-multipart==0.0.20",
    "tenacity==8.5.0",
    "python-dateutil==2.9.0",
    "pytz==2025.2",
    # Pillow is used for image *validation* (dimensions, integrity) at upload time.
    "Pillow==10.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-cov==6.2.1",
    "flake8==7.3.0",
    "isort==7.0.0",
    "mypy==1.18.2",
    "Faker==37.11.0",
]
# PDF rasterization is opt-in so the base install and CI stay lean. pypdfium2 is
# BSD-3-Clause/Apache-2.0 (permissive, commercially usable) and renders PDFs to
# page images on CPU with no GPU or external binary. Without this extra, PDFs
# requiring rasterization fail with a clear, permanent `pdf_renderer_unavailable`
# error rather than producing a wrong result. Images need only Pillow (base).
pdf = [
    "pypdfium2==5.14.0",
]
# Handwriting OCR (Checkpoint D) is opt-in so the base install and CI stay
# lean: torch + transformers are hundreds of megabytes and are only needed when
# OCR_PROVIDER=trocr. Both are CPU-capable; no GPU is required. The default
# OCR_PROVIDER=none works with the base install and fails OCR explicitly.
#
# License note: torch (BSD-3-Clause), transformers (Apache-2.0), and the
# microsoft/trocr-base-handwritten weights (MIT, per the official model card)
# are permissive. TrOCR was fine-tuned on the IAM handwriting database, whose
# terms were NOT re-verified in this checkpoint (host unreachable) — confirm
# training-data terms before any commercial deployment decision.
#
# Versions are pinned to those verified in the target environment (Python
# 3.10, CPU-only torch 2.3.1, transformers 4.57.3).
ocr = [
    "torch==2.3.1+cpu",
    # transformers pulls torchvision for vision encoders (TrOCR included). It
    # MUST match the pinned torch: torchvision 0.18.1 is the release built
    # against torch 2.3.1. A mismatched torchvision (e.g. 0.24.x, built for a
    # newer torch) breaks transformers' lazy loader with a misleading
    # "cannot import name" error, so it is pinned here.
    "torchvision==0.18.1+cpu",
    "transformers==4.57.3",
]

[tool.setuptools]
package-dir = { "" = "backend" }
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers -W ignore::UserWarning -W ignore::DeprecationWarning"
markers = [
    "unit: fast, isolated tests",
    "integration: tests that use the database or filesystem",
    "security: authorization and tenant-isolation tests",
    "slow: expensive tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.isort]
profile = "black"
line_length = 100

[tool.coverage.run]
source = ["backend/app"]
omit = ["backend/app/*_pb2.py"]
